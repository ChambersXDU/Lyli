name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish arm64 release
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify arm64 runner
        run: |
          ARCH="$(uname -m)"
          echo "runner architecture: $ARCH"
          [ "$ARCH" = "arm64" ] || {
            echo "::error::release workflow requires an arm64 macOS runner, got $ARCH" >&2
            exit 1
          }

      - name: Validate tag and determine version
        id: version
        run: |
          TAG="$GITHUB_REF_NAME"
          BUNDLE_VERSION="${TAG#v}"
          if ! BUILD_VERSION="$(bash lyli/scripts/build-version.sh "$BUNDLE_VERSION")"; then
            echo "::error::tag '$TAG' must be vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N" >&2
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          {
            echo "tag=$TAG"
            echo "bundle_version=$BUNDLE_VERSION"
            echo "build_version=$BUILD_VERSION"
            echo "is_prerelease=$IS_PRERELEASE"
            echo "asset_base=Lyli-v${BUNDLE_VERSION}-macos-arm64"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (CFBundleVersion $BUILD_VERSION, prerelease=$IS_PRERELEASE)"

      - name: Run selftest
        run: |
          cd lyli
          swift build --product lyli-selftest
          ./.build/debug/lyli-selftest

      - name: Install dmgbuild
        run: python3 -m pip install --user --break-system-packages dmgbuild
        continue-on-error: true

      - name: Build arm64 release assets
        run: |
          LYLI_VERSION="${{ steps.version.outputs.bundle_version }}" ./lyli/package.sh
          ls -lah lyli/dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.asset_base }}
          path: lyli/dist/*
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Lyli ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            lyli/dist/${{ steps.version.outputs.asset_base }}.zip
            lyli/dist/${{ steps.version.outputs.asset_base }}.zip.sha256
            lyli/dist/${{ steps.version.outputs.asset_base }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published assets
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}"
          assets=(
            "${{ steps.version.outputs.asset_base }}.zip"
            "${{ steps.version.outputs.asset_base }}.zip.sha256"
            "${{ steps.version.outputs.asset_base }}.dmg"
          )
          for name in "${assets[@]}"; do
            ok=""
            for attempt in 1 2 3 4 5 6; do
              if curl -sSfIL --max-time 30 "$BASE/$name" -o /dev/null; then
                ok=1
                break
              fi
              sleep 10
            done
            [ -n "$ok" ] || {
              echo "::error::$BASE/$name is not downloadable" >&2
              exit 1
            }
            echo "ok  $BASE/$name"
          done
