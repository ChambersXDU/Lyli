name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 测试
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Swift selftest
        run: |
          cd lyli
          swift build --product lyli-selftest
          ./.build/debug/lyli-selftest

      - name: 编译整个 App
        run: cd lyli && swift build
