name: Rewrite history to owner commits only

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rewrite-owner-history.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rewrite main history
        shell: bash
        env:
          FIRST_OWNER_COMMIT: de3adfdfc4dd7ebea60f5879f1f1f5727771f2c8
          OWNER_NAME: ChambersXDU
          OWNER_EMAIL: 78330120+ChambersXDU@users.noreply.github.com
        run: |
          set -euo pipefail

          OLD_HEAD="$(git rev-parse HEAD)"
          OLD_TREE="$(git rev-parse HEAD^{tree})"

          test "$(git show -s --format=%P "$FIRST_OWNER_COMMIT")" = "e6bdf6a4563de91f88621c37645b8d11072cb822"

          ROOT_TREE="$(git rev-parse "$FIRST_OWNER_COMMIT^{tree}")"
          ROOT_MESSAGE="$(git show -s --format=%B "$FIRST_OWNER_COMMIT")"
          AUTHOR_NAME="$(git show -s --format=%an "$FIRST_OWNER_COMMIT")"
          AUTHOR_EMAIL="$(git show -s --format=%ae "$FIRST_OWNER_COMMIT")"
          AUTHOR_DATE="$(git show -s --format=%aI "$FIRST_OWNER_COMMIT")"
          COMMITTER_DATE="$(git show -s --format=%cI "$FIRST_OWNER_COMMIT")"

          NEW_ROOT="$(
            printf '%s' "$ROOT_MESSAGE" |
            GIT_AUTHOR_NAME="$AUTHOR_NAME"             GIT_AUTHOR_EMAIL="$AUTHOR_EMAIL"             GIT_AUTHOR_DATE="$AUTHOR_DATE"             GIT_COMMITTER_NAME="$OWNER_NAME"             GIT_COMMITTER_EMAIL="$OWNER_EMAIL"             GIT_COMMITTER_DATE="$COMMITTER_DATE"             git commit-tree "$ROOT_TREE"
          )"

          git config user.name "$OWNER_NAME"
          git config user.email "$OWNER_EMAIL"

          git rebase --onto "$NEW_ROOT" "$FIRST_OWNER_COMMIT" main

          NEW_HEAD="$(git rev-parse HEAD)"
          NEW_TREE="$(git rev-parse HEAD^{tree})"

          test "$OLD_TREE" = "$NEW_TREE"

          COUNT="$(git rev-list --count HEAD)"
          test "$COUNT" -ge 210

          if git log --format='%an <%ae>' | grep -F 'Yudaotor' >/dev/null; then
            echo "::error::Yudaotor is still present in rewritten main history" >&2
            exit 1
          fi

          if git log --format='%an <%ae>' | grep -v -E '^(cham <ywjiangplus@foxmail\.com>|ChambersXDU <78330120\+ChambersXDU@users\.noreply\.github\.com>)$' >/tmp/non_owner_authors.txt; then
            echo "::error::unexpected author(s) remain:" >&2
            cat /tmp/non_owner_authors.txt >&2
            exit 1
          fi

          echo "old head: $OLD_HEAD"
          echo "new head: $NEW_HEAD"
          echo "commit count: $COUNT"
          git log --oneline --reverse | sed -n '1,5p'
          git log --oneline -5

          git push --force-with-lease=refs/heads/main:"$OLD_HEAD" origin HEAD:main
